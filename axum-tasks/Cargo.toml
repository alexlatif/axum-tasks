[package]
name = "axum-tasks"
version = "0.1.0"
edition = "2024"
authors = ["Alessandro Latif <alelat19@gmail.com>"]
license = "MIT"
description = "A lightweight background task queue for Axum applications"
repository = "https://github.com/alexlatif/axum-tasks"
homepage = "https://github.com/alexlatif/axum-tasks"
documentation = "https://docs.rs/axum-tasks"
keywords = ["axum", "async", "background", "tasks", "queue"]
readme = "../README.md"
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
axum = "0.8.4"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flume = "0.11"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.0"
error-stack = { version = "0.5", features = ["std","backtrace"] }
tracing = "0.1"
async-trait = "0.1"
inventory = "0.3"
axum-tasks-derive = "0.1.0"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
bincode = "1"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"], optional = true }

[lib]
name = "axum_tasks"
path = "src/lib.rs"

[dev-dependencies]
tracing-subscriber = "0.3"
tempfile = "3.0"

[features]
default = []
redis = []
postgres = ["tokio-postgres"]
